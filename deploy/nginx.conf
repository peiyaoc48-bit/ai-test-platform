# 子域名 test.yaojade.top → 平台（容器监听 127.0.0.1:3100）
# 证书：certbot --nginx -d test.yaojade.top
#
# 注意：如果服务器的 443 端口已经被其他程序（如代理服务）占用，Nginx 不能再直接监听 443，
# 需要先确认占用情况，改用 SNI 分流（stream 模块按域名转发）或换一个端口，见 deploy/README.md。

server {
    listen 80;
    server_name test.yaojade.top;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name test.yaojade.top;

    ssl_certificate     /etc/letsencrypt/live/test.yaojade.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.yaojade.top/privkey.pem;

    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 步骤与视觉模型调用较慢
        proxy_read_timeout 180s;
    }
}
