# 演示站点登录接口：异常场景（数据驱动）
- id: 密码错误
  body: { username: demo, password: wrong }
  status: 401
  error: 用户名或密码错误
- id: 用户不存在
  body: { username: nobody, password: demo123 }
  status: 401
  error: 用户名或密码错误
- id: 缺少密码
  body: { username: demo }
  status: 400
  error: 请输入用户名和密码
- id: 用户名为空串
  body: { username: "", password: demo123 }
  status: 400
  error: 请输入用户名和密码
- id: 密码类型错误
  body: { username: demo, password: 123 }
  status: 400
  error: 请输入用户名和密码
- id: 空请求体
  body: {}
  status: 400
  error: 请输入用户名和密码
